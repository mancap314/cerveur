# HAProxy terminating TLS (HTTP/1.1 and HTTP/2) and passing the real client
# address with the PROXY protocol v2, including a "client used TLS" flag.
#
# Start the server behind it with:
#   ./server --bind=127.0.0.1 --proxy-protocol 8080
# (--proxy-protocol trusts loopback by default; use --trust-proxy otherwise)

global
    maxconn 20000

defaults
    mode http
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    timeout tunnel  1h            # upgraded WebSockets (the server pings every 20s anyway)
    timeout http-keep-alive 60s

frontend https_in
    bind :443 ssl crt /etc/haproxy/certs/example.com.pem alpn h2,http/1.1
    default_backend stc_app

backend stc_app
    # [!] send-proxy-v2-ssl: PROXY v2 header with the SSL TLV, so the server
    #     knows the client's address and that it used TLS.
    server app1 127.0.0.1:8080 send-proxy-v2-ssl
