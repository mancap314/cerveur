# nginx in front of the STC server: TLS, HTTP/2, compression, and proxying of
# plain HTTP, streaming, server-sent events and WebSockets.
#
# Start the server behind it with:
#   ./server --bind=127.0.0.1 --trust-proxy=127.0.0.1 --keepalive=75000 8080
#
# Values the server depends on are marked [!].

worker_processes auto;
events { worker_connections 4096; }

http {
    access_log off;

    upstream stc_app {
        server 127.0.0.1:8080;
        keepalive 64;                  # pool of idle upstream connections
        keepalive_timeout 60s;         # [!] must be below the server's --keepalive (75s)
    }

    # WebSocket upgrades need "Connection: upgrade"; everything else gets an
    # empty Connection header, which keeps upstream connections pooled.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    server {
        listen 443 ssl http2;          # nginx >= 1.25.1: "listen 443 ssl;" plus "http2 on;"
        server_name example.com;
        ssl_certificate     /etc/ssl/certs/example.com.crt;
        ssl_certificate_key /etc/ssl/private/example.com.key;

        gzip on;                       # compression is the proxy's job
        gzip_proxied any;
        gzip_types text/plain application/json text/css application/javascript;

        client_max_body_size 64m;      # [!] nginx's default 1m would reject large uploads

        location / {
            proxy_pass http://stc_app;
            proxy_http_version 1.1;    # [!] needed for keep-alive and WebSockets
            proxy_set_header Host $host;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;   # stream uploads to the server as they arrive
            # Server-sent events: the server sends "X-Accel-Buffering: no", so
            # they aren't buffered. WebSockets and SSE may stay quiet longer
            # than proxy_read_timeout (60s): the server pings WebSockets and
            # sends SSE comments after 20s of silence, so the default is fine.
        }
    }
}
